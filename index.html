<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ahmad Dewedar · Frontend Developer</title>
    <meta name="description" content="Ahmad Dewedar, frontend developer building bilingual Arabic and English websites with React, motion and careful detail" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#07080a" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="Ahmad Dewedar · Frontend Developer" />
    <meta property="og:description" content="Bilingual Arabic and English websites built with React, motion and careful detail" />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Apply saved theme and language before first paint so neither flashes
      (function () {
        var root = document.documentElement;
        try {
          var theme = localStorage.getItem('ad-theme');
          if (theme === 'light' || theme === 'dark') root.dataset.theme = theme;
          var lang = localStorage.getItem('ad-lang');
          if (lang === 'ar') {
            root.lang = 'ar';
            root.dir = 'rtl';
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,300..800;1,400&family=Readex+Pro:wght@300..700&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>This portfolio needs JavaScript to run</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
